name: CI

on:
  push:
    branches: [main]
  pull_request:

# The bootstrap must be green on the first commit with no repository secrets:
# no job here requires a UniFi key.
permissions:
  contents: read

jobs:
  api:
    name: api (lint, build, test, boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l apps/api)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./apps/api/...
      - name: go build
        run: go build ./apps/api/...
      - name: go test
        run: go test ./apps/api/...
      - name: import boundaries
        run: ./scripts/check-imports.sh

  web:
    name: web (lint, typecheck, test, build, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (a Vitest dependency here) declares
          # engines.node ^22.22.2 || ^24.15.0 || >=26.0.0, so the suite cannot
          # even collect on Node 20: it dies with
          # "TypeError: webidl.util.markAsUncloneable is not a function" and
          # reports 0 tests run. Node 20 is also EOL and the runner already
          # warns about it. 22 is the oldest version the toolchain supports.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: generated API types match openapi/openapi.yaml
        run: npm run openapi:check

  openapi:
    name: openapi contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-secrets.sh

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/smoke.sh
