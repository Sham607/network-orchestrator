openapi: 3.1.0
info:
  title: Network Orchestrator API
  version: 0.1.0
  description: |
    Internal REST API of the Network Orchestrator control plane (backend ↔ dashboard).

    This bootstrap document defines the health/readiness surface and the shared
    error model. The full phase-1 resource contract (sites, devices, clients,
    networks, sync status) is owned by ZENI-6 and extends this file.

    Conventions fixed here (docs/adr/003-architecture.md §5):
      - All paths live under /api/v1 and are same-origin behind Caddy.
      - Every error response uses the single `Error` schema with a stable,
        machine-readable `code`.
      - Cache-backed resources carry `synced_at`; the dashboard must never
        assume the data is fresh.
servers:
  - url: http://localhost:8080
    description: Local development (docker compose)
security:
  - sessionCookie: []
tags:
  - name: health
    description: Liveness, readiness and operational status probes.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      security: []
      summary: Liveness probe
      description: Returns 200 while the process is running. Never touches the database or UniFi.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: getReady
      tags: [health]
      security: []
      summary: Readiness probe
      description: Returns 200 when the database is reachable; 503 otherwise.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [health]
      summary: Cache freshness for operators
      responses:
        "200":
          description: Current sync/worker status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        Server-side operator session cookie, HttpOnly/Secure/SameSite=Lax
        (docs/adr/002-tech-stack.md §6). Auth is not implemented yet; it lands
        with ZENI-6. The /sync/status operation shows the intended requirement.
  schemas:
    Health:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
    Readiness:
      type: object
      required: [status, unifi_enabled, unifi_mode]
      properties:
        status:
          type: string
          example: ready
        unifi_enabled:
          type: boolean
        unifi_mode:
          type: string
          enum: [cloud, local]
    SyncStatus:
      type: object
      required:
        [worker_running, last_successful_sync_at, consecutive_failures, stale, stale_after_seconds]
      properties:
        worker_running:
          type: boolean
        last_successful_sync_at:
          type: [string, "null"]
          format: date-time
          description: Null until the sync worker (ZENI-5) has completed a cycle.
        consecutive_failures:
          type: integer
          minimum: 0
        stale:
          type: boolean
        stale_after_seconds:
          type: integer
          minimum: 1
    Error:
      type: object
      description: The single error shape returned by every endpoint.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable code. Clients branch on this.
          enum:
            - unifi_unreachable
            - unifi_unauthorized
            - unifi_forbidden
            - unifi_rate_limited
            - unifi_schema_drift
            - not_found
            - validation_failed
            - unauthorized
            - forbidden
            - rate_limited
            - internal_error
        message:
          type: string
          description: Human-readable, sanitized message. Never contains secrets.
        details:
          type: object
          additionalProperties: true
          description: Optional context. Always includes `request_id` for log correlation.
  responses:
    ServiceUnavailable:
      description: Dependency (database or UniFi cache) is not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
